; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two GSM hardware backends share this codebase (see src/sms.h), selected
; per-environment via a build flag. Build/upload with:
;   pio run -e fona        (Adafruit FONA shield)
;   pio run -e sim908_at    (DFRobot GPS/GPRS/GSM Module V3.0 / SIM908, raw AT commands)

[env:fona]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -D SMS_BACKEND_FONA

[env:sim908_at]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -D SMS_BACKEND_SIM908_AT
